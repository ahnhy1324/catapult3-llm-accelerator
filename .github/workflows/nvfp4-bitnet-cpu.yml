name: BitNet NVFP4 CPU quality comparison

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/nvfp4-bitnet-cpu.yml"
      - "experiments/nvfp4_bitnet/**"

permissions:
  contents: read

jobs:
  cpu-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiments/nvfp4_bitnet/requirements.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install \
            "git+https://github.com/huggingface/transformers.git@096f25ae1f501a084d8ff2dcaf25fbc2bd60eba4" \
            "accelerate>=0.30" "safetensors>=0.4" "huggingface_hub[hf_xet]" \
            "datasets>=2.19" "pytest>=8"

      - name: Unit-test NVFP4 quantizer
        working-directory: experiments/nvfp4_bitnet
        run: pytest -q

      - name: Record runner resources
        run: |
          lscpu
          free -h
          df -h
          python - <<'PY'
          import torch, transformers
          print("torch", torch.__version__)
          print("transformers", transformers.__version__)
          print("threads", torch.get_num_threads())
          PY

      - name: Disable broken remote-code mapping
        working-directory: experiments/nvfp4_bitnet
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("evaluate.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(", trust_remote_code=True", "")
          text = text.replace("trust_remote_code=True, ", "")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Create compact prompt set
        working-directory: experiments/nvfp4_bitnet
        run: |
          cat > cpu_prompts.txt <<'EOF'
          The capital of France is
          Alice has 12 apples and gives 5 away. The number remaining is
          Continue this sentence with a short technical paragraph: An old FPGA card can still be useful when
          EOF

      - name: Run compact CPU PPL and logits comparison
        working-directory: experiments/nvfp4_bitnet
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/cpu_quality
          /usr/bin/time -v python evaluate.py \
            --device cpu \
            --dtype bfloat16 \
            --quant-work-device cpu \
            --layouts row16 block16x16 \
            --chunk-rows 32 \
            --prompts-file cpu_prompts.txt \
            --skip-generation \
            --ppl \
            --ppl-tokens 256 \
            --ppl-seq-len 128 \
            --output-dir results/cpu_quality \
            2>&1 | tee results/cpu_quality/run.log

      - name: Print report
        if: always()
        working-directory: experiments/nvfp4_bitnet
        run: |
          test -f results/cpu_quality/report.md && cat results/cpu_quality/report.md || true
          test -f results/cpu_quality/results.json && cat results/cpu_quality/results.json || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvfp4-bitnet-cpu-quality
          path: |
            experiments/nvfp4_bitnet/results/cpu_quality
            experiments/nvfp4_bitnet/cpu_prompts.txt
          if-no-files-found: warn
          retention-days: 14
